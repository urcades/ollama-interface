<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <meta
      name="description"
      content="A simple interface for Ollama-served models."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chat-container"></div>
    <div id="input-container">
      <form id="prompt-form">
        <div id="input-wrapper">
          <input
            type="text"
            id="prompt-input"
            placeholder="Send a message to deepseek-r1:8b"
            autocomplete="off"
          />
          <button type="button" id="image-upload-btn" class="hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              width="24"
              height="24"
            >
              <path fill="none" d="M0 0h24v24H0z" />
              <path
                d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-1-11H7v2h4v4h2v-4h4v-2h-4V7h-2v4z"
              />
            </svg>
          </button>
          <input
            type="file"
            id="image-upload"
            accept="image/*"
            style="display: none"
          />
          <div id="image-preview-container" class="hidden">
            <img id="image-preview" alt="Preview" />
            <button type="button" id="remove-image-btn">×</button>
          </div>
        </div>
        <select id="model-selector" class="button-like">
          <option value="">Loading models...</option>
        </select>
        <button type="submit">Send</button>
      </form>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
