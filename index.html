<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <meta
      name="description"
      content="A simple interface for Ollama-served models."
    />
    <style>
      /* CSS Custom Properties */
      :root {
        /* Colors */
        --bg-color-light: #fff;
        --wash-color-light: #ededed;
        --text-color-light: #1a1818;
        --bg-color-dark: #1a1818;
        --wash-color-dark: #2d2d2d;
        --text-color-dark: #fff;
        --param-color-light: #888;
        --param-color-dark: #aaa;

        /* Typography */
        --font-family: serif;
        --font-size-base: 1em;
        --font-size-code: 1em;
        --font-size-icon: 1.5em;
        --font-size-params: 0.75em;

        /* Dimensions */
        --element-height: 3em;
        --border-radius: 1.11em;
        --border-radius-small: calc(var(--border-radius) / 2);

        /* Spacing */
        --spacing-xs: 0.2em;
        --spacing-sm: 0.5em;
        --spacing-md: 0.88em;
        --spacing-lg: 1em;
        --form-gap: 0.44em;

        /* Effects */
        --transition-speed: 0.2s;
        --overlay-bg: rgba(0, 0, 0, 0.5);
        --overlay-bg-darker: rgba(0, 0, 0, 0.7);
        --highlight-color: #4caf50;
        --code-padding: 0.2em 0.4em;

        /* Z-index layers */
        --z-overlay: 2;
      }

      /* Base Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Layout */
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background-color: var(--bg-color-light);
        color: var(--text-color-light);
        font-family: var(--font-family);
        font-size: 1.23em;
        -webkit-font-smoothing: antialiased;
        will-change: transform;
      }

      /* Chat Layout */
      #chat-container {
        flex-grow: 1;
        overflow-y: auto;
        padding: var(--spacing-lg) var(--spacing-lg) 0;
        contain: content;
      }

      #input-container {
        padding: var(--spacing-lg);
        position: relative;
        backdrop-filter: blur(33px);
        -webkit-backdrop-filter: blur(33px);
        background-color: rgba(255, 255, 255, 0.8);
      }

      /* Messages */
      .message {
        padding: var(--spacing-sm) 0;
        contain: content;
      }

      .message:last-child {
        padding-bottom: 0;
      }

      .user-message {
        text-align: right;
      }

      .assistant-message {
        text-align: left;
      }

      .think {
        font-style: italic;
        color: #bababa;
        margin: var(--spacing-lg) 0;
      }

      /* LLM Parameters */
      .llm-parameters-container {
        margin-top: var(--spacing-sm);
      }

      .llm-parameters {
        font-family: monospace;
        font-size: var(--font-size-params);
        color: var(--param-color-light);
        text-align: left;
        padding: var(--spacing-xs);
        border-top: 1px solid var(--wash-color-light);
      }

      /* Form Elements */
      form {
        display: flex;
        gap: var(--form-gap);
        max-width: 100%;
        align-items: center;
        height: var(--element-height);
      }

      /* Common styles for interactive elements */
      #prompt-input,
      select,
      button {
        border: none;
        outline: none;
        font-family: var(--font-family);
        font-size: var(--font-size-base);
        background-color: var(--wash-color-light);
        border-radius: var(--border-radius);
        transition: opacity var(--transition-speed) ease;
        height: var(--element-height);
      }

      #prompt-input {
        flex: 1;
        padding: var(--spacing-md) var(--border-radius);
        color: var(--text-color-light);
        contain: content;
      }

      select {
        padding: var(--spacing-sm) var(--border-radius);
        appearance: none;
        cursor: pointer;
        max-width: 200px;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        contain: content;
      }

      button {
        padding: var(--spacing-sm) var(--border-radius);
        cursor: pointer;
        contain: content;
      }

      #upload-button {
        white-space: nowrap;
      }

      button:hover,
      select:hover {
        opacity: 0.8;
      }

      /* Image handling */
      #image-input {
        display: none;
        position: absolute;
        visibility: hidden;
      }

      #image-preview-container {
        display: none;
        position: relative;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        overflow: hidden;
        width: var(--element-height);
        min-width: var(--element-height);
        max-width: var(--element-height);
        max-height: var(--element-height);
        flex: 0 0 var(--element-height);
        background-color: var(--wash-color-light);
        border-radius: var(--border-radius);
        transition: opacity var(--transition-speed) ease;
        height: var(--element-height);
      }

      #image-preview-container:hover::after {
        content: "×";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--overlay-bg);
        color: var(--text-color-dark);
        font-size: var(--font-size-icon);
        z-index: var(--z-overlay);
      }

      #image-preview {
        width: 100%;
        height: 100%;
        border-radius: var(--border-radius);
        object-fit: cover;
      }

      /* Code Formatting */
      pre {
        background-color: var(--wash-color-light);
        border-radius: var(--border-radius);
        padding: var(--spacing-lg);
        margin: var(--spacing-sm) 0;
        overflow-x: auto;
        contain: content;
      }

      code {
        font-family: monospace;
        font-size: var(--font-size-code);
      }

      pre code {
        display: block;
      }

      :not(pre) > code {
        background-color: var(--wash-color-light);
        padding: var(--code-padding);
        border-radius: var(--border-radius-small);
      }

      /* Mobile Layout */
      @media (max-width: 600px) {
        form {
          flex-wrap: wrap;
        }

        #prompt-input {
          min-width: 100%;
          flex: 1 1 100%;
        }

        select {
          flex: 1;
          min-width: 0;
          max-width: none;
        }

        select,
        button {
          padding: 0.9em var(--border-radius);
        }
      }

      /* Dark Mode */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: var(--bg-color-dark);
          color: var(--text-color-dark);
        }

        #prompt-input,
        select,
        button,
        #image-preview-container,
        pre,
        :not(pre) > code {
          background-color: var(--wash-color-dark);
          color: var(--text-color-dark);
        }

        .llm-parameters {
          color: var(--param-color-dark);
          border-top-color: var(--wash-color-dark);
        }

        pre {
          border-color: #444;
        }

        .think {
          color: #999999;
        }

        #input-container {
          background-color: rgba(26, 24, 24, 0.8);
        }
      }
    </style>
  </head>
  <body>
    <div id="chat-container"></div>
    <div id="input-container">
      <form id="prompt-form">
        <input
          type="file"
          id="image-input"
          accept="image/jpeg, image/png, image/gif, image/webp"
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            z-index: -1;
            overflow: hidden;
          "
        />
        <button
          type="button"
          id="upload-button"
          class="button-like"
          title="Upload Image"
        >
          Hold Image
        </button>
        <div id="image-preview-container">
          <img id="image-preview" src="#" alt="Image preview" />
        </div>
        <input
          type="text"
          id="prompt-input"
          placeholder="Send a message to deepseek-r1:8b"
          autocomplete="off"
        />
        <select id="model-selector" class="button-like">
          <option value="">Loading models...</option>
        </select>
        <button type="submit">Send</button>
      </form>
    </div>
    <script src="app.js"></script>
  </body>
</html>
