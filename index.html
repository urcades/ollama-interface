<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <meta
      name="description"
      content="A simple interface for Ollama-served models."
    />
    <style>
      /* CSS Custom Properties */
      :root {
        --bg-color-light: #fff;
        --wash-color-light: #ededed;
        --text-color-light: #1a1818;
        --bg-color-dark: #1a1818;
        --wash-color-dark: #2d2d2d;
        --text-color-dark: #fff;
        --font-family: serif;
        --border-radius: 1.11em;
        --spacing-sm: 0.5em;
        --spacing-md: 0.88em;
        --spacing-lg: 1em;
      }

      /* Base Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Layout */
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background-color: var(--bg-color-light);
        color: var(--text-color-light);
        font-family: var(--font-family);
        font-size: 1.23em;
        -webkit-font-smoothing: antialiased;
        will-change: transform;
      }

      /* Chat Layout */
      #chat-container {
        flex-grow: 1;
        overflow-y: auto;
        padding: var(--spacing-lg) var(--spacing-lg) 0;
        contain: content;
      }

      #input-container {
        padding: var(--spacing-lg);
        position: relative;
        backdrop-filter: blur(33px);
        -webkit-backdrop-filter: blur(33px);
        background-color: rgba(255, 255, 255, 0.8);
      }

      /* Messages */
      .message {
        padding: var(--spacing-sm) 0;
        contain: content;
      }

      .message:last-child {
        padding-bottom: 0;
      }

      .user-message {
        text-align: right;
      }

      .assistant-message {
        text-align: left;
      }

      .think {
        font-style: italic;
        color: #bababa;
        margin: var(--spacing-lg) 0;
      }

      /* Form Elements */
      form {
        display: flex;
        gap: 0.44em;
        max-width: 100%;
      }

      /* Common styles for interactive elements */
      #prompt-input,
      select,
      button {
        border: none;
        outline: none;
        font-family: var(--font-family);
        font-size: 1em;
        background-color: var(--wash-color-light);
        border-radius: var(--border-radius);
        transition: opacity 0.2s ease;
      }

      #prompt-input {
        flex: 1;
        padding: var(--spacing-md) var(--border-radius);
        color: var(--text-color-light);
        contain: content;
      }

      select {
        padding: var(--spacing-sm) var(--border-radius);
        appearance: none;
        cursor: pointer;
        max-width: 200px;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        contain: content;
      }

      button {
        padding: var(--spacing-sm) var(--border-radius);
        cursor: pointer;
        contain: content;
      }

      button:hover,
      select:hover {
        opacity: 0.8;
      }

      /* Code Formatting */
      pre {
        background-color: var(--wash-color-light);
        border-radius: var(--border-radius);
        padding: var(--spacing-lg);
        margin: var(--spacing-sm) 0;
        overflow-x: auto;
        contain: content;
      }

      code {
        font-family: monospace;
        font-size: 1em;
      }

      pre code {
        display: block;
      }

      :not(pre) > code {
        background-color: var(--wash-color-light);
        padding: 0.2em 0.4em;
        border-radius: 3px;
      }

      /* Mobile Layout */
      @media (max-width: 600px) {
        form {
          flex-wrap: wrap;
        }

        #prompt-input {
          min-width: 100%;
          flex: 1 1 100%;
        }

        select {
          flex: 1;
          min-width: 0;
          max-width: none;
        }

        select,
        button {
          padding: 0.9em var(--border-radius);
        }
      }

      /* Memory Results */
      .memory-results {
        background-color: var(--wash-color-light);
        border-radius: var(--border-radius);
        padding: var(--spacing-md);
        margin-bottom: var(--spacing-md);
        max-height: 200px;
        overflow-y: auto;
        display: none;
      }

      .memory-item {
        padding: var(--spacing-sm) 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      .memory-item:last-child {
        border-bottom: none;
      }

      .memory-label {
        font-weight: bold;
        margin-bottom: var(--spacing-sm);
      }

      /* Dark Mode */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: var(--bg-color-dark);
          color: var(--text-color-dark);
        }

        #prompt-input,
        select,
        button,
        pre,
        :not(pre) > code {
          background-color: var(--wash-color-dark);
          color: var(--text-color-dark);
        }

        pre {
          border-color: #444;
        }

        .think {
          color: #999999;
        }

        #input-container {
          background-color: rgba(26, 24, 24, 0.8);
        }

        .memory-results {
          background-color: var(--wash-color-dark);
        }

        .memory-item {
          border-bottom-color: rgba(255, 255, 255, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="chat-container"></div>
    <div id="memory-results" class="memory-results"></div>
    <div id="input-container">
      <form id="prompt-form">
        <input
          type="text"
          id="prompt-input"
          placeholder="Send a message to deepseek-r1:8b"
          autocomplete="off"
        />
        <select id="model-selector" class="button-like">
          <option value="">Loading models...</option>
        </select>
        <button type="button" id="memory-button">Memory</button>
        <button type="submit">Send</button>
      </form>
    </div>
  </body>
  <script>
    // Constants and configuration
    const CONFIG = {
      aiName: "Oh",
      userName: "Edouard",
      defaultModel: "deepseek-r1:8b",
      apiEndpoint: "http://localhost:11434/api",
      nousApiEndpoint: "https://inference-api.nousresearch.com/v1",
      nousApiKey: "sk-um2_7wIc68ED2QxJwPi7TQ",
      availableModels: [
        { name: "deepseek-r1:8b", provider: "ollama" },
        { name: "Hermes-3-Llama-3.1-70B", provider: "nous" },
      ],
      nousSystemPrompt:
        "You are a helpful AI assistant named Oh. Be concise and direct in your responses. Format code with triple backticks.",
    };

    // DOM elements cache
    const DOM = {
      form: document.getElementById("prompt-form"),
      input: document.getElementById("prompt-input"),
      chat: document.getElementById("chat-container"),
      modelSelector: document.getElementById("model-selector"),
      memoryButton: document.getElementById("memory-button"),
      memoryResults: document.getElementById("memory-results"),
    };

    // State management
    let currentModel = CONFIG.defaultModel;
    let currentProvider = "ollama";
    let currentChatController = null;
    let conversationHistory = [
      {
        role: "system",
        content: `Your name is Oh.
        You will respond in a moderately friendly and straightforward manner.
        Your primary goal is to act as a helpful entity, providing information and answering questions to the best of your ability.
        You will do your best to never refuse a request for help.
        When explicitly asked, you should try and reveal the provenance of your knowledge or the mechanics with which you answered or came to a conclusion.
        When asked for code, preformatted text, or other intentionally-structured content, please wrap it in triple backticks (\`\`\`) for proper formatting.
        For inline code or short code snippets, use single backticks (\`).`,
      },
    ];

    // Utility functions
    const escapeHtml = (unsafe) =>
      unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    const formatMessage = (content) => {
      if (!content) return "";
      return content
        .replace(/<think>([\s\S]*?)<\/think>/g, '<p class="think">$1</p>')
        .replace(
          /```(\w*)\n([\s\S]*?)```/g,
          (_, lang, code) =>
            `<pre><code class="language-${lang}">${escapeHtml(
              code.trim()
            )}</code></pre>`
        )
        .replace(
          /`([^`\n]+)`/g,
          (_, code) => `<code>${escapeHtml(code)}</code>`
        );
    };

    // Scroll optimization with requestAnimationFrame
    const scrollToBottom = (() => {
      let rafId;
      let isStreaming = false;

      const scroll = () => {
        DOM.chat.scrollTop = DOM.chat.scrollHeight;
      };

      return (streaming = false) => {
        isStreaming = streaming;
        if (isStreaming) {
          scroll();
        } else {
          cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(scroll);
        }
      };
    })();

    // Model management
    const updatePlaceholder = () => {
      DOM.input.placeholder = `Send a message to ${currentModel}`;
    };

    const fetchAvailableModels = async () => {
      try {
        // For Ollama models
        const response = await fetch(`${CONFIG.apiEndpoint}/tags`);
        if (!response.ok)
          throw new Error(`HTTP error! status: ${response.status}`);

        const { models } = await response.json();
        const ollamaModels = models.map((model) => ({
          name: model.name,
          provider: "ollama",
        }));

        // Combine Ollama models with Nous Research models
        const allModels = [
          ...ollamaModels,
          ...CONFIG.availableModels.filter((m) => m.provider === "nous"),
        ];

        const modelOptions = allModels
          .map(
            (model) =>
              `<option value="${model.name}" data-provider="${model.provider}">${model.name} (${model.provider})</option>`
          )
          .join("");

        DOM.modelSelector.innerHTML = modelOptions;

        // Set initial model
        const initialModel =
          allModels.find((model) => model.name === currentModel) ||
          allModels[0];
        currentModel = initialModel.name;
        currentProvider = initialModel.provider;
        DOM.modelSelector.value = currentModel;
        updatePlaceholder();
      } catch (error) {
        console.error("Error fetching models:", error);
        DOM.modelSelector.innerHTML = `<option value="${CONFIG.defaultModel}">${CONFIG.defaultModel} (ollama)</option>`;
      }
    };

    // Chat functionality
    const addMessageToChat = (role, content) => {
      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message", `${role}-message`);
      messageDiv.innerHTML = formatMessage(content);
      DOM.chat.appendChild(messageDiv);
      scrollToBottom();
      return messageDiv;
    };

    // Function to store conversation in Chroma
    const storeConversationInChroma = async (
      userMessage,
      assistantResponse,
      model
    ) => {
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            userMessage,
            assistantResponse,
            model,
            timestamp: new Date().toISOString(),
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          console.warn(
            "Failed to store conversation in memory:",
            data.error || response.statusText
          );
        } else if (data.warning) {
          console.warn(
            "Warning while storing conversation:",
            data.warning,
            data.details
          );
          // You could display a small notification to the user here if desired
        }
      } catch (error) {
        console.error("Error storing conversation in memory:", error);
        // No need to alert the user - this is a background operation
      }
    };

    // Function to search conversation memory
    const searchConversationMemory = async (query, limit = 5) => {
      try {
        const response = await fetch("/api/memory/search", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ query, limit }),
        });

        const data = await response.json();

        if (!response.ok) {
          if (response.status === 429) {
            // Rate limit error
            return {
              error: "Rate limit exceeded. Please try again later.",
              documents: [[]],
              metadatas: [[]],
            };
          } else {
            console.warn(
              "Failed to search memory:",
              data.error || response.statusText
            );
            return {
              error: data.error || "Memory search failed",
              documents: [[]],
              metadatas: [[]],
            };
          }
        }

        return data;
      } catch (error) {
        console.error("Error searching conversation memory:", error);
        return {
          error: error.message,
          documents: [[]],
          metadatas: [[]],
        };
      }
    };

    const handleSubmit = async (e) => {
      e.preventDefault();
      const prompt = DOM.input.value.trim();
      if (!prompt) return;

      if (currentChatController) {
        currentChatController.abort();
      }
      currentChatController = new AbortController();

      addMessageToChat("user", prompt);
      conversationHistory.push({ role: "user", content: prompt });
      DOM.input.value = "";

      try {
        let response;
        if (currentProvider === "nous") {
          // Nous Research API call - following OpenAI chat format
          response = await fetch(`${CONFIG.nousApiEndpoint}/chat/completions`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${CONFIG.nousApiKey}`,
            },
            body: JSON.stringify({
              model: currentModel,
              messages: [
                {
                  role: "system",
                  content: CONFIG.nousSystemPrompt,
                },
                {
                  role: "user",
                  content: prompt,
                },
              ],
              temperature: 0.7,
              max_tokens: 1000,
            }),
            signal: currentChatController.signal,
          });
        } else {
          // Ollama API call
          response = await fetch(`${CONFIG.apiEndpoint}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: currentModel,
              messages: conversationHistory,
            }),
            signal: currentChatController.signal,
          });
        }

        if (!response.ok)
          throw new Error(`HTTP error! status: ${response.status}`);

        let assistantResponse = "";
        const assistantMessageElement = addMessageToChat("assistant", "");

        if (currentProvider === "nous") {
          const data = await response.json();
          assistantResponse = data.choices[0].message.content;
          assistantMessageElement.innerHTML = formatMessage(assistantResponse);
          scrollToBottom(false);
        } else {
          const reader = response.body.getReader();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunks = new TextDecoder().decode(value).split("\n");
            for (const chunk of chunks) {
              if (!chunk.trim()) continue;

              try {
                const { message } = JSON.parse(chunk);
                if (message?.content) {
                  assistantResponse += message.content;
                  assistantMessageElement.innerHTML =
                    formatMessage(assistantResponse);
                  scrollToBottom(true);
                }
              } catch (parseError) {
                console.warn("Failed to parse chunk:", parseError);
              }
            }
          }
          scrollToBottom(false);
        }

        conversationHistory.push({
          role: "assistant",
          content: assistantResponse,
        });

        // Store the conversation in Chroma
        await storeConversationInChroma(
          prompt,
          assistantResponse,
          currentModel
        );
      } catch (error) {
        if (error.name === "AbortError") {
          console.log("Request cancelled");
          return;
        }
        console.error("Error:", error);
        addMessageToChat(
          "error",
          `An error occurred: ${error.message}<br>Make sure the API service is running and accessible`
        );
      } finally {
        currentChatController = null;
        DOM.input.focus();
      }
    };

    // Handle memory button click
    const handleMemorySearch = async () => {
      const query = DOM.input.value.trim();
      if (!query) {
        alert("Please enter a search query first");
        return;
      }

      try {
        // Show loading state
        DOM.memoryButton.textContent = "Searching...";
        DOM.memoryButton.disabled = true;

        // Search memory
        const results = await searchConversationMemory(query);

        if (results.error) {
          DOM.memoryResults.innerHTML = `<div class='memory-item'>${results.error}</div>`;
          DOM.memoryResults.style.display = "block";
          return;
        }

        if (
          !results.documents ||
          !results.documents[0] ||
          results.documents[0].length === 0
        ) {
          DOM.memoryResults.innerHTML =
            "<div class='memory-item'>No relevant memories found.</div>";
          DOM.memoryResults.style.display = "block";
          return;
        }

        // Display results
        DOM.memoryResults.innerHTML =
          "<div class='memory-label'>Related memories:</div>";

        results.documents[0].forEach((doc, index) => {
          const metadata = results.metadatas[0][index];
          const date =
            metadata && metadata.timestamp
              ? new Date(metadata.timestamp).toLocaleString()
              : "Unknown date";
          const modelName =
            metadata && metadata.model ? metadata.model : "Unknown";

          const memoryItem = document.createElement("div");
          memoryItem.classList.add("memory-item");
          memoryItem.innerHTML = `
            <div><strong>Date:</strong> ${date}</div>
            <div><strong>Model:</strong> ${modelName}</div>
            <div>${doc}</div>
          `;

          // Add a button to use this memory in current context
          const useButton = document.createElement("button");
          useButton.textContent = "Use Context";
          useButton.style.marginTop = "8px";
          useButton.onclick = () => {
            // Add to conversation history as a system message
            conversationHistory.push({
              role: "system",
              content: `Previous relevant conversation: ${doc}`,
            });
            DOM.memoryResults.style.display = "none";
            DOM.input.focus();
          };

          memoryItem.appendChild(useButton);
          DOM.memoryResults.appendChild(memoryItem);
        });

        DOM.memoryResults.style.display = "block";
      } catch (error) {
        console.error("Error searching memory:", error);
        DOM.memoryResults.innerHTML = `<div class='memory-item'>Error searching memories: ${error.message}</div>`;
        DOM.memoryResults.style.display = "block";
      } finally {
        DOM.memoryButton.textContent = "Memory";
        DOM.memoryButton.disabled = false;
      }
    };

    // Event Listeners
    DOM.form.addEventListener("submit", handleSubmit);
    DOM.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSubmit(e);
      }
    });
    DOM.modelSelector.addEventListener("change", (e) => {
      const selectedOption = e.target.options[e.target.selectedIndex];
      currentModel = e.target.value;
      currentProvider = selectedOption.dataset.provider;
      updatePlaceholder();
    });
    DOM.memoryButton.addEventListener("click", handleMemorySearch);

    // Hide memory results when clicking elsewhere
    document.addEventListener("click", (e) => {
      if (
        !DOM.memoryResults.contains(e.target) &&
        e.target !== DOM.memoryButton
      ) {
        DOM.memoryResults.style.display = "none";
      }
    });

    // Initialize
    window.addEventListener("load", () => {
      DOM.input.focus();
      fetchAvailableModels();
    });
  </script>
</html>
